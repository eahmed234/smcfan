# macsmc_hwmon publishes every SMC key in its temperature table as a hwmon
# temp channel, including keys that are not temperatures and keys whose device
# does not exist on a given model. On a MacBookPro11,2 those read:
#
#   temp9   TCMc  CPU eDRAM hot indicator (0/1, not a temperature)
#   temp14  TCFC  CPU PECI die temperature filter coefficient (8192 C)
#   temp15  TCTD  CPU PECI die temperature trend            (0 C)
#   temp25  TH0c  Drive 0 raw temperature C                 (-127 C)
#   temp26  TH0R  Drive 0 relative cooked temperature max   (-49 C)
#   temp27  TH0F  Drive 0 relative filtered temperature max (-49 C)
#
# Install as /etc/sensors.d/macsmc_hwmon.conf to keep them out of `sensors`.
# Desktop widgets that read hwmon directly are unaffected by this file.
# libsensors syntax is indentation-based; chip stanzas do not use braces.
chip "macsmc_hwmon-*"
    ignore temp9
    ignore temp14
    ignore temp15
    ignore temp25
    ignore temp26
    ignore temp27
